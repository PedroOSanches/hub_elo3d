name: Backend CI

on:
    push:
    pull_request:
    workflow_call:
        secrets:
            JWT_SECRET:
                required: true
jobs:
    code-quality:
        name: Code Quality
        uses: ./.github/workflows/code-quality.yml

    automated-test:
        name: Automated Tests
        needs: code-quality
        uses: ./.github/workflows/automated-tests-backend.yml
        secrets:
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
