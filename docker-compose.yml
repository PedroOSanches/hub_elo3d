services:
  frontend:
    build:
      context: ./frontend
      dockerfile: iac/Dockerfile
    container_name: hub_frontend
    ports:
      - "80:3000"
    depends_on:
      - backend
    
    env_file:
      - ./.env

  backend:
    build:
      context: ./backend
      dockerfile: iac/Dockerfile
    container_name: hub_backend
    ports:
      - "8000:8000"
    
    env_file:
    - ./.env