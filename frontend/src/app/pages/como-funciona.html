<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como Funciona - Seção Timeline</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="../../app/style/como-funciona.css">
</head>
<body>

  <section class="how-it-works-section">
    <div class="how-it-works-container">
      
      <header class="brand-header">
        <h2 class="brand-title">
          <span class="title-black">COMO</span>
          <span class="title-wine">FUNCIONA</span>
        </h2>
        <p class="brand-subtitle">Do projeto à transformação</p>
      </header>

      <div class="steps-wrapper">
        
        <div class="step-item">
          <div class="step-icon-circle">
            <i class="fa-regular fa-paste"></i>
          </div>
          <p class="step-text">A AACD cadastra<br>a demanda</p>
        </div>

        <div class="step-connector"></div>

        <div class="step-item">
          <div class="step-icon-circle">
            <i class="fa-solid fa-user-group"></i>
          </div>
          <p class="step-text">A rede encontra<br>o projeto</p>
        </div>

        <div class="step-connector"></div>

        <div class="step-item">
          <div class="step-icon-circle">
            <i class="fa-solid fa-cube"></i>
          </div>
          <p class="step-text">Produção<br>Colaborativa</p>
        </div>

        <div class="step-connector"></div>

        <div class="step-item">
          <div class="step-icon-circle">
            <i class="fa-regular fa-heart"></i>
          </div>
          <p class="step-text">Mais autonomia<br>para quem precisa</p>
        </div>

      </div>

    </div>
  </section>

</body>
</html>
