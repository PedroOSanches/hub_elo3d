<dialog class="modal" id="modal-contato" aria-labelledby="titulo-modal-contato">
    <button type="button" class="modal_fechar" data-fechar-contato aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="21" y1="3" x2="3" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>

    <h2 class="modal_titulo" id="titulo-modal-contato">Contato</h2>

    <form id="form-contato">
        <div class="campo">
            <label class="campo_rotulo" for="f-nome">Nome do responsável:</label>
            <input class="campo_input" type="text" id="f-nome" name="nome" required>
        </div>

        <div class="campo">
            <label class="campo_rotulo" for="f-email">E-mail:</label>
            <input class="campo_input" type="email" id="f-email" name="email" required>
        </div>

        <div class="campo">
            <label class="campo_rotulo" for="f-phone">Telefone:</label>
            <div class="campo_telefone">
                <span id="ddi">+55</span>
                <input class="campo_input" type="tel" id="f-phone" name="telefone" aria-describedby="ddi" required>
            </div>
        </div>

        <div class="modal_acoes">
            <app-button
                class="contato-modal__button"
                type="button"
                text="Cancelar"
                data-fechar-contato>
            </app-button>
            <app-button
                class="contato-modal__button"
                type="submit"
                text="Salvar"
                data-salvar-contato>
            </app-button>
        </div>
    </form>
</dialog>
