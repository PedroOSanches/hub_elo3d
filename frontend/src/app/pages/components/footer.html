<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navbar Elo3D Hub</title>
  <link rel="stylesheet" href="../../style/components/footer.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <footer class="footer">
        <div class="footer-container">
            <!-- Bloco 1: Logo e Slogan -->
            <div class="footer-brand">
                <img src="../../assets/aacd-seeklogo 1.png" alt="Logo" class="footer-logo" />
                <div class="footer-slogan">
                    <p>Vida é <span class="highlight">movimento</span></p>
                    <p class="footer-sub">Há mais de 70 anos <br> promovendo inclusão <br> e qualidade de vida</p>
                </div>
            </div>

            <div class="footer-item">
                <div class="footer-icon">
                    <i class="ri-map-pin-line"></i>
                </div>
                <div class="footer-text">
                    <h4>Endereço</h4>
                    <p>Rua Borges Lagoa, 1505 –<br>Ibirapuera, São Paulo – SP</p>
                </div>
            </div>

            <div class="footer-item">
                <div class="footer-icon">
                    <i class="ri-phone-line"></i>
                </div>
                <div class="footer-text">
                    <h4>Telefone</h4>
                    <p>(11) 5576-0777</p>
                </div>
            </div>

            <div class="footer-item">
                <div class="footer-icon">
                    <i class="ri-mail-line"></i>
                </div>
                <div class="footer-text">
                    <h4>E-mail</h4>
                    <p>aacd@aacd.com.br</p>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
