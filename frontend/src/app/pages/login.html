<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hub Elo3D</title>
  <script src="../js/components/custom_button.js" defer></script>
  <link rel="stylesheet" href="../../app/style/login.css">
</head>
<body>

  <div class="login-container">
    <div class="logo-box">
      <img src="../assets/LOGO.png" alt="HUB Elo3D Logo" />
    </div>

    <div class="login-header">
      <h1>Bem-vindo(a) ao Elo3D!</h1>
      <p>Parceiros e profissionais da AACD acessam por aqui.</p>
    </div>

    <form class="login-form">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <app-button text="Entrar →" href="home.html"></app-button>
    </form>

    <div class="divider">
      <span>ou</span>
    </div>

    <a href="cadastro.html" class="btn-secondary">Criar conta</a>
  </div>

</body>
</html>
