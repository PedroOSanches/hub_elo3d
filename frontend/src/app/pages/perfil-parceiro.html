<header class="projects-header">
    <app-navbar
        logo="assets/Group 3.png"
        icon="assets/icons/icon-perfil.svg"
        css="style/components/navbar.css"
        profile-href="/perfil"
        first-text="Minhas Impressoras"
        first-href="/minhas-impressoras"
        second-text="Meus Projetos"
        second-href="/meus-projetos"
        third-text="Projetos Disponíveis"
        third-href="/projetos-disponiveis">
    </app-navbar>
</header>
<main>
    <header class="profile">
        <div class="profile-heading">
            <h1>Meu <span>Perfil</span></h1>
            <button type="button" class="logout-profile-button" data-logout>Sair</button>
        </div>
    </header>

    <div class="profile-content">

        <section class="card" aria-labelledby="titulo-endereco">
            <div class="internal-card">
                <h2 id="titulo-endereco">Endereço</h2>
                <dl class="data">
                    <dt>Endereço</dt>
                    <dd data-profile-field="address"></dd>

                    <dt>Bairro</dt>
                    <dd data-profile-field="neighborhood"></dd>

                    <dt>Cidade/ Estado</dt>
                    <dd data-profile-field="city-state"></dd>

                    <dt>CEP</dt>
                    <dd data-profile-field="cep"></dd>
                </dl>
                <div>
                    <button type="button" class="button-edit" data-open-endereco>Editar</button>
                </div>
            </div>
        </section>

        <section class="card" aria-labelledby="titulo-contato">
            <div class="internal-card">
                <h2 id="titulo-contato">Contato</h2>
                <dl class="data">
                    <dt>Nome do Responsável</dt>
                    <dd data-profile-field="name"></dd>

                    <dt>E-mail</dt>
                    <dd data-profile-field="email"></dd>

                    <dt>Telefone</dt>
                    <dd data-profile-field="phone"></dd>
                </dl>
                <div class="card-actions">
                    <button type="button" class="button-edit" data-open-contato>Editar</button>
                </div>
            </div>
        </section>
    </div>
</main>
